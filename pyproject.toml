[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyqtlabgraph"
version = "0.1.1"
description = "Reusable PySide6/PyQtGraph live plotting widget with toolbar, legend, and smart axis formatting."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
]
authors = [
    { name = "Claudius Hoberg" },
]
keywords = ["pyside6", "qt", "pyqtgraph", "plotting", "scientific-visualization", "data-visualization", "live-plot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.optional-dependencies]
dev = [
    "tomli>=2; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/choberg/pyqtlabgraph"
Repository = "https://github.com/choberg/pyqtlabgraph"
"Bug Tracker" = "https://github.com/choberg/pyqtlabgraph/issues"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["pyqtlabgraph*"]

[tool.setuptools.package-data]
pyqtlabgraph = [
    "py.typed",
    "assets/autox.png",
    "assets/autoy.png",
    "assets/edit_params.png",
    "assets/reset_zoom.png",
    "assets/rolling.png",
    "assets/saveplot.png",
    "assets/x-zoom.png",
    "assets/y-zoom.png",
    "assets/zoom_area.png",
]
