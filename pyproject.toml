[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyqt-lab-graph"
version = "0.1.0"
description = "Reusable PySide6/PyQtGraph live plotting widget with toolbar, legend, and smart axis formatting."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
]
authors = [
    { name = "PyQtLabGraph contributors" },
]
keywords = ["pyside6", "qt", "pyqtgraph", "plotting", "scientific-visualization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
]

[tool.setuptools.packages.find]
include = ["pyqt_lab_graph*"]

[tool.setuptools.package-data]
pyqt_lab_graph = ["assets/*.png"]
