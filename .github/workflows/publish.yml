name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  attestations: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write  # Mandatory for Trusted Publishing (OIDC)
    environment:
      name: release
      url: https://pypi.org/p/pyqtlabgraph
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Check release tag matches package version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          package_version = pyproject["project"]["version"]
          tag_version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if tag_version != package_version:
              raise SystemExit(
                  f"Release tag {tag_version!r} does not match package version {package_version!r}"
              )
          PY

      - name: Build package
        run: uv build

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
