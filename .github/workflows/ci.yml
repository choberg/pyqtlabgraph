name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest -q

      - name: Run smoke checks
        run: python tests/run_smoke_checks.py

      - name: Run Ruff
        run: ruff check pyqtlabgraph tests examples

      - name: Run Mypy
        run: mypy pyqtlabgraph

      - name: Build distributions
        run: python -m build

      - name: Verify wheel in a clean environment
        shell: bash
        run: |
          wheel_path="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel_path"
          python -m venv "$RUNNER_TEMP/pyqtlabgraph-wheel"
          "$RUNNER_TEMP/pyqtlabgraph-wheel/bin/python" -m pip install "$wheel_path"
          "$RUNNER_TEMP/pyqtlabgraph-wheel/bin/python" tests/verify_installed_package.py
